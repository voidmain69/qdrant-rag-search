services:
  qdrant:
    image: qdrant/qdrant:v1.17.1
    restart: unless-stopped
    # Safety ceilings to bound runaway memory (not a sizing recommendation) — tune per
    # host and catalog size. At ≤100k products vectors sit in RAM in the low hundreds of MB.
    mem_limit: ${QDRANT_MEM_LIMIT:-4g}
    ports:
      - "6333:6333"   # REST + dashboard (http://localhost:6333/dashboard)
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24

  api:
    build: .
    restart: unless-stopped
    # ~2.2 GB ONNX models + optional torch reranker + working set. Ceiling to cap runaway
    # (e.g. concurrent large uploads), not a minimum — raise if you enable the reranker.
    mem_limit: ${API_MEM_LIMIT:-6g}
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      # no default on purpose: compose fails fast instead of shipping a well-known secret
      API_KEYS: ${API_KEYS:?Set API_KEYS in .env (cp .env.example .env)}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_FORMAT: ${LOG_FORMAT:-}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
      DENSE_MODEL: ${DENSE_MODEL:-intfloat/multilingual-e5-large}
      DENSE_DIM: ${DENSE_DIM:-1024}
      SPARSE_MODEL: ${SPARSE_MODEL:-Qdrant/bm25}
      SPARSE_LANGUAGE: ${SPARSE_LANGUAGE:-russian}
      RERANK_ENABLED: ${RERANK_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      QUERY_LLM_ENABLED: ${QUERY_LLM_ENABLED:-false}
      QUERY_LLM_MODEL: ${QUERY_LLM_MODEL:-gemma4:e4b}
      INGEST_LLM_ENABLED: ${INGEST_LLM_ENABLED:-false}
      INGEST_LLM_MODEL: ${INGEST_LLM_MODEL:-gemma4:e4b}
      # durable background-job state (imports + async batches) survives restarts
      JOBS_DB_PATH: ${JOBS_DB_PATH:-/data/jobs.db}
      DEBUG: ${DEBUG:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach host-side Ollama from the container
    volumes:
      - model_cache:/models   # ~2.2 GB of ONNX models, downloaded once on first start
      - jobs_data:/data       # SQLite job store — persists import/batch job progress
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 300s   # first start downloads embedding models

  # internal admin / testing / eval console (Streamlit) — talks to the api over HTTP.
  # The console has full write/delete/reconcile power and NO auth of its own, so it is
  # bound to loopback only: reach it via an SSH tunnel or an authenticating reverse
  # proxy, never by publishing 8501 on a public interface. Override UI_BIND to expose it
  # deliberately (e.g. UI_BIND=0.0.0.0 behind a VPN).
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    restart: unless-stopped
    mem_limit: ${UI_MEM_LIMIT:-1g}
    ports:
      - "${UI_BIND:-127.0.0.1}:8501:8501"
    environment:
      API_BASE_URL: http://api:8000
      API_KEY: ${API_KEYS:?}   # server-side; the key never reaches the browser
    volumes:
      - ./eval:/app/eval       # labels added in the UI persist back to the repo
    depends_on:
      api:
        condition: service_healthy

volumes:
  qdrant_data:
  model_cache:
  jobs_data:

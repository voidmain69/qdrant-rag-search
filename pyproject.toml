[project]
name = "qdrant-product-search"
version = "0.1.0"
description = "Production-grade hybrid product search service on Qdrant: semantic + BM25 + exact/fuzzy code matching"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139,<1.0",
    "uvicorn[standard]>=0.35",
    "pydantic>=2.12",
    "pydantic-settings>=2.10",
    "qdrant-client>=1.18,<2.0",
    "fastembed>=0.8,<0.9",
    "rapidfuzz>=3.14,<4.0",
    "python-multipart>=0.0.20",
    "openpyxl>=3.1",
    "orjson>=3.10",
    # LLM backends (Ollama / OpenAI-compatible) are called over plain HTTP
    "httpx>=0.28",
    # observability
    "asgi-correlation-id>=4.3",
    "prometheus-client>=0.21",
    "prometheus-fastapi-instrumentator>=7.0",
    "sentry-sdk>=2.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "httpx>=0.28",
    "ruff>=0.12",
    "mypy>=1.14",
    "pre-commit>=4.0",
]
rerank = [
    "sentence-transformers>=5.0",
    "torch>=2.7",
]
# admin/testing/eval console — `uv run --group ui streamlit run ui/Home.py`
ui = [
    "streamlit>=1.40",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires running docker compose stack",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "C4",     # flake8-comprehensions
    "RUF",    # ruff-specific
    "ASYNC",  # flake8-async (blocking calls in async code)
]

# Cyrillic homoglyphs and uk/ru strings are this project's domain, not typos
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"app/api/**" = ["B008"]           # Depends() in defaults is idiomatic FastAPI
"scripts/gen_sample_data.py" = ["E501", "C408"]  # dict(...) rows read better for sample data
"app/services/llm.py" = ["ASYNC109"]  # timeout is a per-call httpx budget, not an asyncio.timeout
# a fake LLMClient overrides complete_json, so it must mirror the ABC's `timeout` param
"tests/unit/test_query_understanding.py" = ["ASYNC109"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
files = ["app"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "fastembed.*",
    "openpyxl.*",
    "prometheus_fastapi_instrumentator.*",
    "rapidfuzz.*",
]
ignore_missing_imports = true

# sentence-transformers (optional rerank group) is treated as opaque whether or not it
# is installed — its CrossEncoder API shifts between versions and mypy must behave the
# same in CI (dep absent) and on a rerank-enabled dev box (dep present).
[[tool.mypy.overrides]]
module = ["sentence_transformers.*"]
ignore_missing_imports = true
follow_imports = "skip"
